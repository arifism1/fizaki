<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist phone receiver + checkmark icon -->
  <!-- Represents: answered calls + booked appointments -->

  <!-- Left curve of receiver -->
  <path d="M 20 28 Q 20 24 24 24 L 32 24 Q 36 24 36 28" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right curve of receiver -->
  <path d="M 28 24 Q 28 24 32 28 L 40 36 Q 44 40 40 44" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark - represents "answered" and "booked" -->
